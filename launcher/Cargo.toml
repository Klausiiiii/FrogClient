[package]
name = "frogclient-launcher"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
# Lifts the offline-account restriction for development before Mojang approves the app.
dev = []

[dependencies]
slint = "1.18"
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "net", "time"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
hex = "0.4"
thiserror = "2"
keyring = "4"
md-5 = "0.10"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
