[package]
name = "frogclient-launcher"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
# Lifts the offline-account restriction for development before Mojang approves the app.
dev = []

[dependencies]
slint = "1.18"
directories = "6"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
